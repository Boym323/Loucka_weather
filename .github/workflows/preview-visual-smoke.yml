name: Public dev website visual smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/preview-visual-smoke.yml"
  schedule:
    - cron: "23 8 * * *"
permissions:
  contents: read
concurrency:
  group: loucka-public-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install pinned Playwright browser
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Visit deployed dev website, check 11 routes, desktop and mobile
        working-directory: frontend
        run: node scripts/preview-visual-check.mjs
        env:
          LOUCKA_PREVIEW_URL: https://dev.pocasi-loucka.eu
          LOUCKA_EXPECT_COMMIT: ${{ github.event_name == 'push' && github.sha || '' }}
      - name: Verify public GW3000 live painting and browser-only archival failover
        working-directory: frontend
        run: node scripts/live-browser-check.mjs
        env:
          LOUCKA_PREVIEW_URL: https://dev.pocasi-loucka.eu
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preview-screenshots
          path: frontend/test-results/preview-screenshots
          retention-days: 7
          if-no-files-found: warn
