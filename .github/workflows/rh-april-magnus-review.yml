name: RH April Magnus review gate (offline)
on:
  pull_request:
    paths:
      - 'deploy/lxc/rh-april-magnus-review.mjs'
      - 'deploy/lxc/tests/rh-april-magnus-review.test.mjs'
      - 'api/scripts/qc-rh-april-stage-risk-lib.mjs'
      - '.github/workflows/rh-april-magnus-review.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/lxc/rh-april-magnus-review.mjs'
      - 'deploy/lxc/tests/rh-april-magnus-review.test.mjs'
      - 'api/scripts/qc-rh-april-stage-risk-lib.mjs'
      - '.github/workflows/rh-april-magnus-review.yml'
permissions:
  contents: read
jobs:
  synthetic-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test original-only manual review policy
        run: node --test deploy/lxc/tests/rh-april-magnus-review.test.mjs
