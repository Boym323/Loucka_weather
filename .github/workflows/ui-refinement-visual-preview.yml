name: UI refinement – pre-PR visual screenshots
on:
  push:
    branches: [feat/ui-refinement-camera-charts-home-20261118]
    paths:
      - "frontend/**"
      - ".github/workflows/ui-refinement-visual-preview.yml"

permissions:
  contents: read
concurrency:
  group: ui-refinement-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Astro for visual review
        run: npm run build
      - name: Capture current branch before PR
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/loucka-ui-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:4321/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --show-error http://127.0.0.1:4321/ >/dev/null
          node scripts/ux-pre-ci-capture.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-refinement-before-pr
          path: frontend/test-results/pre-ci-screenshots
          retention-days: 7
          if-no-files-found: ignore
