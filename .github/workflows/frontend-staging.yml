name: Astro frontend – typecheck, tests, static build

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-staging.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-staging.yml"

jobs:
  frontend:
    # Playwright 1.56.1 supports Ubuntu 24.04; ubuntu-latest moved to 26.04.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Type and Astro diagnostics
        run: npm run check
      - name: Validate browser smoke test syntax
        run: |
          node --check scripts/preview-visual-check.mjs
          node --check scripts/mobile-slow4g-lab.mjs
          node --check scripts/live-browser-check.mjs
          node --check scripts/accessibility-audit.mjs
          node --check scripts/theme-browser-check.mjs
          node --check scripts/climate-atlas-browser-check.mjs
          node --check scripts/wind-compass-browser-check.mjs
          node --check scripts/current-failover-race-browser-check.mjs
          node --check scripts/current-coalesce-browser-check.mjs
          node --check scripts/ux-media-history-browser-check.mjs
          node --check scripts/home-css-route-browser-check.mjs
          node --check scripts/mobile-home-variant-browser-check.mjs
          node --check scripts/mobile-home-history-lazy-browser-check.mjs
          node --check scripts/design-final-browser-check.mjs
          node --check scripts/portal-functional-browser-check.mjs
          node --check scripts/map-model-browser-check.mjs
      - name: Unit tests
        run: npm test
      - name: Build static website
        run: npm run build
      - name: Verify responsive layout and legibility in Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1 axe-core@4.14.0
          # Ubuntu security apt mirror returned HTTP 503 on 19 Nov: use the
          # runner's provisioned browser libraries; install only pinned Chromium.
          npx playwright install chromium
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/loucka-layout-preview.log 2>&1 &
          node scripts/evergreen-layout-audit.mjs
          node scripts/year-comparison-browser-check.mjs
          node scripts/accessibility-audit.mjs
          node scripts/theme-browser-check.mjs
          node scripts/climate-atlas-browser-check.mjs
          node scripts/wind-compass-browser-check.mjs
          node scripts/current-failover-race-browser-check.mjs
          node scripts/current-coalesce-browser-check.mjs
          node scripts/ux-media-history-browser-check.mjs
          node scripts/home-css-route-browser-check.mjs
          node scripts/mobile-home-variant-browser-check.mjs
          node scripts/mobile-home-history-lazy-browser-check.mjs
          node scripts/design-final-browser-check.mjs
          node scripts/portal-functional-browser-check.mjs
          node scripts/map-model-browser-check.mjs
          node scripts/climate-firstfold-review.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evergreen-layout-audit
          path: |
            frontend/test-results/layout-audit
            frontend/test-results/climate-firstfold-review
            frontend/test-results/mobile-home-variant
            frontend/test-results/design-final
            frontend/test-results/portal-functional
            frontend/test-results/map-model
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wcag-browser-audit
          path: frontend/test-results/accessibility/axe-wcag.json
          retention-days: 14
          if-no-files-found: ignore
