# Internal HTTP behind Nginx Proxy Manager (NPM). No Internet NAT to 8080.
limit_req_zone $binary_remote_addr zone=loucka_api_preview:10m rate=5r/s;
server {
    listen 8080;
    server_name _;
    root /srv/loucka-preview/current;
    index index.html;
    autoindex off;
    server_tokens off;
    location ^~ /api/v1/ {
        limit_req zone=loucka_api_preview burst=12 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /[.] { deny all; }
}
