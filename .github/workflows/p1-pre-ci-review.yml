name: Pre-CI P1 visual review

on:
  push:
    branches: [feat/perf-current-coalesce-20261119]
    paths:
      - ".github/workflows/p1-pre-ci-review.yml"

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build preview
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Capture P1 mobile/desktop light and dark
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/loucka-p1-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4321/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4321/ >/dev/null
          node scripts/p1-visual-audit.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p1-current-before-ci-screenshots
          path: frontend/test-results/p1-visual-review
          retention-days: 7
