# Internal HTTP behind Nginx Proxy Manager (NPM). No Internet NAT to 8080.
# Trust ONLY the exact upstream NPM address(es) installed locally as
# set_real_ip_from directives. Without those, the existing 5r/s limit remains
# a shared fail-closed upstream limit. Do not trust arbitrary client-supplied XFF.
real_ip_header X-Forwarded-For;
real_ip_recursive on;
include /etc/nginx/loucka-trusted-proxy/*.conf;
limit_req_zone $binary_remote_addr zone=loucka_api_preview:10m rate=5r/s;
server {
    listen 8080;
    server_name _;
    root /srv/loucka-preview/current;
    index index.html;
    autoindex off;
    server_tokens off;
    location ^~ /api/v1/ {
        limit_req zone=loucka_api_preview burst=12 nodelay;
        limit_req_status 429;
        error_page 429 = @api_rate_limited;
        # Internal API stays JSON-only; avoid MIME type sniffing in browsers.
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }
    location @api_rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"schemaVersion":"1","error":{"code":"TOO_MANY_REQUESTS","message":"Rate limit exceeded","requestId":"$request_id"}}';
    }
    # Astro fingerprints generated JS/CSS/assets. Immutable one-year cache is
    # safe only for /_astro/ paths, never for HTML or deployment.json.
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }
    location = /deployment.json {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Preview only: do not index unreleased weather portal pages.
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ~ /[.] { deny all; }
}
