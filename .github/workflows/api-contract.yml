name: OpenAPI contract (offline)
on:
  push:
    paths: ['openapi.yaml', 'schemas/**', 'tests/**', '.github/workflows/api-contract.yml']
  pull_request:
    paths: ['openapi.yaml', 'schemas/**', 'tests/**', '.github/workflows/api-contract.yml']
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m compileall -q tests
      - run: python -m pytest -q tests/test_contract.py tests/test_parity_runner.py tests/test_unit_conversion.py
      - run: echo "Passing offline fixtures is NOT evidence that Fastify, Go, or Rust servers implement API v1."
