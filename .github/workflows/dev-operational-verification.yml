name: One-off actual DEV operational verification

on:
  push:
    branches: [audit/dev-operational-smoke-20261118]
    paths:
      - ".github/workflows/dev-operational-verification.yml"

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install browser dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
          ffprobe -version | head -n 1
      - name: Verify actual DEV website, camera and browser behavior
        run: node scripts/dev-operational-verification.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: actual-dev-operational-evidence
          path: frontend/test-results/dev-operational-verify
          retention-days: 7
          if-no-files-found: warn
