name: UX pre-CI screenshots (temporary branch preview)

on:
  push:
    branches:
      - fix/ux-post-audit-20261118
    paths:
      - 'frontend/**'
      - '.github/workflows/ux-pre-ci-snapshots.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Build preview for visual inspection
        run: npm run build
      - name: Capture without running the CI test suite
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/loucka-ux-capture.log 2>&1 &
          node scripts/ux-pre-ci-capture.mjs
      - name: Upload screenshots for human review before PR
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ux-pre-ci-screenshots
          path: frontend/test-results/pre-ci-screenshots
          retention-days: 7
          if-no-files-found: ignore
