name: LXC preview deployment config
on:
  push:
    branches: [main]
    paths:
      - "deploy/lxc/**"
      - ".github/workflows/lxc-preview-config.yml"
  pull_request:
    paths:
      - "deploy/lxc/**"
      - ".github/workflows/lxc-preview-config.yml"
jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Validate Bash syntax
        run: |
          bash -n deploy/lxc/auto-deploy-preview.sh
          bash -n deploy/lxc/site-readiness-audit.sh
          bash -n deploy/lxc/loucka-preview-api-activate.sh
          grep -Fqx 'OnActiveSec=45s' deploy/lxc/loucka-preview-sync.timer
          grep -Fqx 'OnUnitInactiveSec=2min' deploy/lxc/loucka-preview-sync.timer
          systemd-analyze verify deploy/lxc/loucka-preview-sync.timer
          # A new static release may only be published by the post-build helper.
          grep -Fq 'publish_pending() {' deploy/lxc/loucka-preview-api-activate.sh
          grep -Fq 'pending_tmp=' deploy/lxc/auto-deploy-preview.sh
          if grep -Fq 'mv -Tf "$WEB/.current.next" "$WEB/current"' deploy/lxc/auto-deploy-preview.sh; then
            echo 'ERROR: the unprivileged build publishes before API readiness' >&2
            exit 1
          fi
          grep -Fqx 'ExecStart=/usr/bin/node dist/src/main.js' deploy/lxc/loucka-weather-api.service
          grep -Fqx 'ExecStartPost=+/usr/local/libexec/loucka-preview-api-activate.sh' deploy/lxc/loucka-preview-sync.service
      - name: Validate collector and local CAP scope tests
        run: |
          python3 -m py_compile deploy/lxc/loucka-data-collector.py
          python3 -m py_compile deploy/lxc/loucka-gw3000-live.py
          python3 -m py_compile deploy/lxc/loucka-gw3000-http-pull.py
          python3 -m py_compile deploy/lxc/loucka-monitor.py
          python3 -m py_compile deploy/lxc/preview-performance-check.py
          python3 -m unittest discover -s deploy/lxc/tests -p 'test_*.py'
      - name: Validate Nginx syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx
          sudo cp deploy/lxc/nginx-preview.conf /etc/nginx/conf.d/loucka-preview.conf
          sudo nginx -t
          grep -Fq 'X-Robots-Tag "noindex, nofollow"' deploy/lxc/nginx-preview.conf
