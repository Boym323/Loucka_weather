openapi: 3.1.1
info:
  title: Loučka Weather API
  version: 0.2.0-draft
  description: |
    Language-neutral DRAFT; no production endpoint currently exists.
    UTC instants; WeeWX archive intervals are (start,end], while calendar period
    ranges such as yearly statistics include the local start and exclude the local end.
    Source records are normalized per-row by WeeWX usUnits (1=US,16=METRIC,17=METRICWX).
    The optional query 'units' selects presentation units; default metricwx (degC, mm, m/s).
    Unknown source systems fail closed; custom sensor units are never guessed. Null is not zero.
    Response 'units' records the selected system; field 'unit' is authoritative.
    Dataset original is default. Approved reconstructions require independent QC and
    activation; otherwise HTTP 503 DATASET_UNAVAILABLE.
    Scientific metric aggregation rules live in schemas/aggregation-policy.json.
    All endpoints are public read-only and same-origin; no user credentials, no DB writes.
    Unknown parameters and unsupported metric/aggregation pairs are rejected.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
    description: Same-origin reverse proxy
security: []
paths:
  /api/v1/station:
    get:
      operationId: getStation
      summary: Public station metadata, verified fields and available capabilities
      description: Unknown physical coordinates or altitude remain null; never guess.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200': { $ref: '#/components/responses/Station' }
        '304': { $ref: '#/components/responses/NotModified' }
        '429': { $ref: '#/components/responses/TooMany' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/sensors:
    get:
      operationId: getSensors
      summary: Audited sensor inventory, availability and installation epochs
      description: Non-null data alone does not establish sensor identity or depth.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200': { $ref: '#/components/responses/Sensors' }
        '304': { $ref: '#/components/responses/NotModified' }
        '429': { $ref: '#/components/responses/TooMany' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/current:
    get:
      operationId: getCurrent
      summary: Last known observation at/before asOf
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - name: asOf
          in: query
          required: false
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Units'
        - $ref: '#/components/parameters/Dataset'
      responses:
        '200': { $ref: '#/components/responses/Current' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooMany' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/history:
    get:
      operationId: getHistory
      summary: Bounded time series over (from,to], measured by interval end
      description: |
        raw maximum range is 31 days, hourly maximum 2 years, daily entire archive.
        auto chooses resolution within limit, with explicit gaps and per-metric statistics.
        No silent truncation: 422 LIMIT_EXCEEDED. Empty history is 200 points=[].
        Output downsampling policy must preserve extrema and missing intervals.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/Metric'
        - $ref: '#/components/parameters/Units'
        - $ref: '#/components/parameters/Dataset'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: resolution
          in: query
          required: false
          schema: { type: string, enum: [auto, raw, hourly, daily], default: auto }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 10000, default: 2000 }
      responses:
        '200': { $ref: '#/components/responses/History' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/InvalidRange' }
        '429': { $ref: '#/components/responses/TooMany' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/climate/temperature-years:
    get:
      operationId: getAllYearsTemperature
      summary: Daily outdoor temperature across every available year in one read-only response
      description: |
        A single bounded SELECT over original WeeWX archive_day_outTemp.
        Dates and period lengths use Europe/Prague local midnight, including 23/25-hour DST days.
        Mean temperatures are weighted by sumtime. Incomplete and malformed daily rows
        are labelled; missing dates are omitted, never zero-filled. Data remain original_unverified.
        The current unfinished day is excluded. Browser charts may compare daily and
        time-weighted monthly values, but the baseline is NOT an approved climate normal.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/Dataset'
        - name: units
          in: query
          schema: { type: string, enum: [metricwx], default: metricwx }
      responses:
        '200':
          description: Daily temperature values and measurement-time coverage since 2009
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, metric, unit, dataset, qcStatus, firstYear, endsBefore, points]
                properties:
                  schemaVersion: { type: string, const: '1' }
                  metric: { type: string, const: outTemp }
                  unit: { type: string, const: '°C' }
                  dataset: { type: string, const: original }
                  qcStatus: { type: string, const: original_unverified }
                  firstYear: { type: integer, const: 2009 }
                  endsBefore: { type: string, format: date }
                  dataRevision: { type: string }
                  points:
                    type: array
                    maxItems: 7500
                    items:
                      type: object
                      required: [date, year, monthDay, value, validSeconds, expectedSeconds, quality]
                      properties:
                        date: { type: string, format: date }
                        year: { type: integer, minimum: 2009 }
                        monthDay:
                          type: string
                          pattern: '^[0-9]{2}-[0-9]{2}$'
                        value: { type: [number, 'null'] }
                        validSeconds: { type: [integer, 'null'], minimum: 0 }
                        expectedSeconds: { type: integer, minimum: 82800, maximum: 90000 }
                        quality: { type: string, enum: [derived, partial, missing, suspect] }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/InvalidRange' }
        '429': { $ref: '#/components/responses/TooMany' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/climate/annual-matrix:
    get:
      operationId: getConsolidatedAnnualClimate
      summary: All available calendar-year summaries for one original WeeWX metric
      description: |
        One bounded SELECT-only scan of archive_day_<metric> produces 2009 through
        the last *completed* Europe/Prague day. Mean is weighted by sumtime, sum
        is additive, minima/maxima follow the per-metric aggregation policy.
        Missing/invalid daily data are never zero-filled. Each year exposes
        elapsedDays, validDays, missingDays, timeCoverageFraction and QC provenance.
        This is NOT an approved reconstruction; reference stations and candidates
        are not silently mixed with station measurements.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/Metric'
        - $ref: '#/components/parameters/Units'
        - $ref: '#/components/parameters/Dataset'
      responses:
        '200':
          description: One metric, every available year, plus provenance and completeness
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, metric, aggregation, dataset, qcStatus, years]
                properties:
                  schemaVersion: { type: string, const: '1' }
                  metric: { type: string }
                  aggregation: { type: string, enum: [mean, sum, min, max] }
                  dataset: { type: string, const: original }
                  qcStatus: { type: string, const: original_unverified }
                  dataRevision: { type: string }
                  startsAt: { type: string, format: date }
                  endsBefore: { type: string, format: date }
                  years:
                    type: array
                    maxItems: 92
                    items:
                      type: object
                      required: [year, calendarDays, elapsedDays, validDays, missingDays, value, unit, qcStatus]
                      properties:
                        year: { type: integer, minimum: 2009, maximum: 2100 }
                        calendarDays: { type: integer, minimum: 365, maximum: 366 }
                        elapsedDays: { type: integer, minimum: 0, maximum: 366 }
                        validDays: { type: integer, minimum: 0, maximum: 366 }
                        missingDays: { type: integer, minimum: 0, maximum: 366 }
                        invalidDays: { type: integer, minimum: 0 }
                        sourceRows: { type: integer, minimum: 0 }
                        completenessFraction: { type: [number, 'null'], minimum: 0, maximum: 1 }
                        timeCoverageFraction: { type: [number, 'null'], minimum: 0, maximum: 1 }
                        value: { type: [number, 'null'] }
                        unit: { type: string }
                        method: { type: string, enum: [time_weighted_mean, sum, minimum, maximum] }
                        qcStatus: { type: string, const: original_unverified }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/InvalidRange' }
        '429': { $ref: '#/components/responses/TooMany' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/statistics/yearly:
    get:
      operationId: getYearlyStatistics
      summary: Yearly aggregate based on Europe/Prague calendar
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/Metric'
        - $ref: '#/components/parameters/Units'
        - $ref: '#/components/parameters/Dataset'
        - name: year
          in: query
          required: true
          schema: { type: integer, minimum: 2009, maximum: 2100 }
        - name: aggregation
          in: query
          required: true
          schema: { type: string, enum: [mean, min, max, sum, count, vecdir, dir_at_max] }
      responses:
        '200': { $ref: '#/components/responses/Yearly' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/InvalidRange' }
        '429': { $ref: '#/components/responses/TooMany' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/statistics/daily:
    get:
      operationId: getDailyStatistics
      summary: Daily statistic for a Europe/Prague calendar day
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/Metric'
        - $ref: '#/components/parameters/Units'
        - $ref: '#/components/parameters/Dataset'
        - $ref: '#/components/parameters/Aggregation'
        - name: date
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
            example: '2026-10-30'
      responses:
        '200': { $ref: '#/components/responses/PeriodStats' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/InvalidRange' }
        '429': { $ref: '#/components/responses/TooMany' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/statistics/monthly:
    get:
      operationId: getMonthlyStatistics
      summary: Monthly statistic for a Europe/Prague calendar month
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/Metric'
        - $ref: '#/components/parameters/Units'
        - $ref: '#/components/parameters/Dataset'
        - $ref: '#/components/parameters/Aggregation'
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
            example: '2026-10'
      responses:
        '200': { $ref: '#/components/responses/PeriodStats' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/InvalidRange' }
        '429': { $ref: '#/components/responses/TooMany' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/live:
    get:
      operationId: streamLive
      summary: Shared LOOP live data via Server-Sent Events
      description: |
        text/event-stream. Types: snapshot, observation, status, reset,
        archive-updated. Every JSON data frame validates against
        schemas/features.schema.json#/$defs/LiveMessage.
        archive-updated is emitted only after committed archive rows are
        visible to the read-only API; it is not a synthetic 5-minute timer.
        Archive events declare affected end-time range, dataRevision and
        summaryStatus=pending|ready|unknown. Do not refresh published
        daily/monthly/yearly statistics until summaryStatus=ready.
        The SSE hub MUST continue to transmit archive-updated when MQTT/LOOP
        is offline; 503 describes an unavailable SSE service, not merely a
        disconnected live sensor. Frontend may fallback to conditional HTTP GET.
        First event is snapshot/status; heartbeat comment every 15s.
        retry 5000ms; bounded replay on Last-Event-ID or reset+snapshot.
        Event IDs are process-scoped. No MQTT credentials or private URL in browser.
        State stale after 120s without valid LOOP events; label archive fallback.
        Disable proxy buffering and disconnect slow stream consumers.
      parameters:
        - $ref: '#/components/parameters/Units'
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: SSE stream; each data field is versioned JSON validated separately
          headers:
            Cache-Control:
              schema: { type: string, enum: ['no-cache, no-transform'] }
            X-Accel-Buffering:
              schema: { type: string, enum: ['no'] }
          content:
            text/event-stream:
              schema:
                type: string
              x-event-data-schema: './schemas/features.schema.json#/$defs/LiveMessage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooMany' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/camera/status:
    get:
      operationId: getCameraStatus
      summary: Metadata for sanitized server-side webcam snapshot
      description: Do not expose internal camera stream, token, or credential.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200': { $ref: '#/components/responses/CameraStatus' }
        '304': { $ref: '#/components/responses/NotModified' }
        '429': { $ref: '#/components/responses/TooMany' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/readyz:
    get:
      operationId: getReadiness
      summary: Sanitized dependency readiness separate from cheap liveness
      responses:
        '200': { $ref: '#/components/responses/Readiness' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/healthz:
    get:
      operationId: getHealth
      summary: Cheap service liveness without querying MariaDB
      responses:
        '200': { $ref: '#/components/responses/Health' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  parameters:
    Aggregation:
      name: aggregation
      in: query
      required: true
      description: Metric-specific allowlists in schemas/aggregation-policy.json.
      schema: { type: string, enum: [mean, min, max, sum, count, vecdir, dir_at_max] }
    Dataset:
      name: dataset
      in: query
      required: false
      description: >
        original reads unmodified WeeWX. approved requires explicit QC publication;
        absent an approved dataset return 503 DATASET_UNAVAILABLE.
      schema: { type: string, enum: [original, approved], default: original }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: { type: string, maxLength: 256 }
    Units:
      name: units
      in: query
      required: false
      description: |
        Requested output unit system. Input records are independently decoded using
        their stored WeeWX usUnits code (1,16,17). Omitted means metricwx.
        Invalid requested units return HTTP 400 BAD_REQUEST.
        'us' returns °F, mph, inches, inHg; 'metric' °C, km/h, cm, hPa;
        'metricwx' °C, m/s, mm, hPa. Some physical quantities do not change.
      schema:
        type: string
        enum: [us, metric, metricwx]
        default: metricwx
    Metric:
      name: metric
      in: query
      required: true
      schema:
        type: string
        enum: [altimeter, appTemp, barometer, cloudbase, dewpoint, ET, extraHumid1, extraHumid2, extraTemp1, extraTemp2, heatindex, humidex, inDewpoint, inHumidity, inTemp, lightning_distance, lightning_disturber_count, lightning_noise_count, lightning_strike_count, luminosity, maxSolarRad, outHumidity, outTemp, pm25_1, pressure, radiation, rain, rainRate, soilTemp1, soilTemp2, soilTemp3, soilTemp4, soilTemp5, soilTemp6, UV, wbgt, windchill, windDir, windGust, windGustDir, windrun, windSpeed, outEquiTemp, dayET, ET24]
  responses:
    NotModified:
      description: ETag matched; no response body
    Station:
      description: Station metadata and capabilities
      content:
        application/json:
          schema:
            $ref: './schemas/features.schema.json#/$defs/StationResponse'
    Sensors:
      description: Sensor catalogue and activation epochs
      content:
        application/json:
          schema:
            $ref: './schemas/features.schema.json#/$defs/SensorsResponse'
    PeriodStats:
      description: Daily or monthly aggregate
      content:
        application/json:
          schema:
            $ref: './schemas/features.schema.json#/$defs/PeriodStatsResponse'
    CameraStatus:
      description: Webcam latest snapshot status
      content:
        application/json:
          schema:
            $ref: './schemas/features.schema.json#/$defs/CameraStatusResponse'
    Readiness:
      description: Sanitized readiness
      content:
        application/json:
          schema:
            $ref: './schemas/features.schema.json#/$defs/ReadinessResponse'
    Current:
      description: Current conditions
      content:
        application/json:
          schema:
            $ref: './schemas/weather.schema.json#/$defs/CurrentResponse'
    History:
      description: Time series
      content:
        application/json:
          schema:
            $ref: './schemas/weather.schema.json#/$defs/HistoryResponse'
    Yearly:
      description: Annual statistic
      content:
        application/json:
          schema:
            $ref: './schemas/weather.schema.json#/$defs/YearlyResponse'
    Health:
      description: Health status
      content:
        application/json:
          schema:
            $ref: './schemas/weather.schema.json#/$defs/HealthResponse'
    BadRequest:
      description: Invalid query or unknown metric
      content:
        application/json:
          schema:
            $ref: './schemas/weather.schema.json#/$defs/ErrorResponse'
    InvalidRange:
      description: Invalid/unsupported range
      content:
        application/json:
          schema:
            $ref: './schemas/weather.schema.json#/$defs/ErrorResponse'
    NotFound:
      description: No observation
      content:
        application/json:
          schema:
            $ref: './schemas/weather.schema.json#/$defs/ErrorResponse'
    TooMany:
      description: Rate limit
      headers:
        Retry-After:
          description: Number of seconds before retry
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            $ref: './schemas/weather.schema.json#/$defs/ErrorResponse'
    Unavailable:
      description: Upstream unavailable
      content:
        application/json:
          schema:
            $ref: './schemas/weather.schema.json#/$defs/ErrorResponse'
    Internal:
      description: Sanitized error
      content:
        application/json:
          schema:
            $ref: './schemas/weather.schema.json#/$defs/ErrorResponse'
