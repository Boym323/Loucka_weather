      responses:
        '200': { $ref: '#/components/responses/PeriodStats' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/InvalidRange' }
        '429': { $ref: '#/components/responses/TooMany' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/live:
    get:
      operationId: streamLive
      summary: One-way SSE stream from shared LOOP source, not per-client SQL
      description: |
        text/event-stream UTF-8, event names snapshot, observation, status, reset.
        JSON data validates as features.schema.json#/$defs/LiveEvent.
        First event is snapshot/status. Heartbeat comments every 15s, retry 5000ms.
        Reconnect Last-Event-ID may replay bounded retained events, else reset+snapshot.
        Event IDs are opaque and process-scoped. Mark stale after 120s without LOOP.
        Archive fallback MUST be labelled state=archive_fallback. Disable proxy buffering.
        Per-client queues have bounds and disconnect slow clients.
      parameters:
        - $ref: '#/components/parameters/Units'
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Server-Sent Events (not JSON)
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooMany' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/camera/status:
    get:
      operationId: getCameraStatus
      summary: Public metadata for sanitized latest webcam image
      description: Private camera URLs and credentials never leave server-side capture worker.
      responses:
        '200': { $ref: '#/components/responses/CameraStatus' }
        '304': { $ref: '#/components/responses/NotModified' }
        '429': { $ref: '#/components/responses/TooMany' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/readyz:
    get:
      operationId: getReadiness
      summary: Sanitized dependency readiness; distinct from cheap healthz
      responses:
        '200': { $ref: '#/components/responses/Readiness' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/healthz:
    get:
      operationId: getHealth
      summary: Cheap and sanitized liveness, without mandatory SQL
      responses:
        '200': { $ref: '#/components/responses/Health' }
        '503': { $ref: '#/components/responses/Unavailable' }
