name: LXC preview deployment config
on:
  push:
    branches: [main]
    paths:
      - "deploy/lxc/**"
      - ".github/workflows/lxc-preview-config.yml"
  pull_request:
    paths:
      - "deploy/lxc/**"
      - ".github/workflows/lxc-preview-config.yml"
jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: |
          bash -n deploy/lxc/auto-deploy-preview.sh
          bash -n deploy/lxc/loucka-preview-api-activate.sh
          grep -Fqx 'ExecStart=/usr/bin/node dist/src/main.js' deploy/lxc/loucka-weather-api.service
          grep -Fqx 'ExecStartPost=+/usr/local/libexec/loucka-preview-api-activate.sh' deploy/lxc/loucka-preview-sync.service
      - name: Validate collector and local CAP scope tests
        run: |
          python3 -m py_compile deploy/lxc/loucka-data-collector.py
          python3 -m py_compile deploy/lxc/loucka-gw3000-live.py
          python3 -m py_compile deploy/lxc/loucka-monitor.py
          python3 -m unittest discover -s deploy/lxc/tests -p 'test_*.py'
      - name: Validate Nginx syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx
          sudo cp deploy/lxc/nginx-preview.conf /etc/nginx/conf.d/loucka-preview.conf
          sudo nginx -t
