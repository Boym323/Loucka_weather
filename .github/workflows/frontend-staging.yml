name: Astro frontend – typecheck, tests, static build

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-staging.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-staging.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Temporary lockfile export for reproducible build
        run: node -e "const fs=require('fs');console.log('LOUCKA_LOCKFILE_START'+JSON.stringify(fs.readFileSync('package-lock.json','utf8'))+'LOUCKA_LOCKFILE_END')"
      - name: Type and Astro diagnostics
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build static website
        run: npm run build
