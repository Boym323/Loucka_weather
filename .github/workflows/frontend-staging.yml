name: Astro frontend – typecheck, tests, static build

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-staging.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-staging.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Type and Astro diagnostics
        run: npm run check
      - name: Validate browser smoke test syntax
        run: |
          node --check scripts/preview-visual-check.mjs
          node --check scripts/live-browser-check.mjs
      - name: Unit tests
        run: npm test
      - name: Build static website
        run: npm run build
      - name: Verify responsive layout and legibility in Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/loucka-layout-preview.log 2>&1 &
          node scripts/evergreen-layout-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evergreen-layout-audit
          path: frontend/test-results/layout-audit
          retention-days: 7
          if-no-files-found: ignore
